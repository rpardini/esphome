esphome:
  name: apple-macos-smc-full-avahi
  friendly_name: Apple macOS SMC Full Avahi

host:
  # Any locally administered MAC; it only has to be unique among your ESPHome devices.
  mac_address: "02:ec:40:00:00:14"

logger:
  level: DEBUG

api:

mdns:
  bonjour: true

time:
  - platform: host
    id: host_time

# ---------------------------------------------------------------------------
# apple_smc
#
# Tuned for a Mac mini M4 Pro (Mac16,11). Key names are not published by
# Apple, so the ones below were picked by reading every key twice, once idle
# and once with all 14 cores busy, and keeping the ones that moved. Expect to
# redo that on a different Mac: another model has other keys.
#
# To see what your own machine offers, point discovery at "*" once and read
# the "discovered ..." lines that `esphome config` prints. There were 1474 of
# them here, which is why the block below asks for a handful of families
# rather than everything.
# ---------------------------------------------------------------------------
apple_smc:
  discovery:
    update_interval: 60s
    # Off in Home Assistant until you go and enable the ones you want
    disabled_by_default: true
    include:
      - "Tpx*" # hottest core of each performance cluster
      - "Tex*" # efficiency clusters
      - "Tg0*" # GPU
      - "TH0*" # storage
      - "PHP*" # the CPU, GPU and memory split of the package power
    exclude:
      # Named explicitly below, so discovery must not create them twice
      - "Tpx1"
      - "Tex1"
      - "Tg0k"
      - "TH0x"
      - "PHPC"

sensor:
  # --- temperatures ------------------------------------------------------
  # Reads highest of every die sensor on this machine, so it is the one to
  # watch: around 49 C idle, and 90 to 100 C with all 14 cores busy.
  - platform: apple_smc
    id: soc_temp
    key: TCMz
    name: SoC Hotspot Temperature
    update_interval: 10s

  - platform: apple_smc
    key: Tsx0
    name: SoC Temperature
    update_interval: 30s

  # The performance cores park themselves when idle and report 0 C while they
  # are parked; a reading only appears once there is work to do.
  - platform: apple_smc
    key: Tpx1
    name: P-Core Cluster Temperature
    update_interval: 30s

  - platform: apple_smc
    key: Tex1
    name: E-Core Cluster Temperature
    update_interval: 30s

  - platform: apple_smc
    key: Tg0k
    name: GPU Temperature
    update_interval: 30s

  - platform: apple_smc
    key: TH0x
    name: Storage Temperature
    update_interval: 60s

  # --- fan ---------------------------------------------------------------
  - platform: apple_smc
    id: fan_speed
    key: F0Ac
    name: Fan Speed
    update_interval: 10s

  - platform: apple_smc
    key: F0Tg
    name: Fan Target Speed
    update_interval: 30s

  # A fixed limit, so it arrives as a diagnostic that is not worth graphing
  - platform: apple_smc
    key: F0Mx
    name: Fan Maximum Speed

  # --- power -------------------------------------------------------------
  # Around 6 W with the machine doing nothing, 25 to 33 W with every core busy.
  - platform: apple_smc
    id: system_power
    key: PSTR
    name: System Power
    update_interval: 10s

  - platform: apple_smc
    key: PHPC
    name: CPU Power
    update_interval: 10s

  # The wall side of the supply. This one is worth a sanity check: DC In
  # Voltage times DC In Current comes out at exactly DC In Power.
  - platform: apple_smc
    key: PDTR
    name: DC In Power
    update_interval: 30s

  - platform: apple_smc
    key: VD0R
    name: DC In Voltage
    update_interval: 30s

  - platform: apple_smc
    key: ID0R
    name: DC In Current
    update_interval: 30s

  # --- odds and ends -----------------------------------------------------
  # A flag key, so it reads 0 or 1. Nothing is known about the A family, so
  # the component leaves room for a fraction it will never have; say so.
  - platform: apple_smc
    key: AC-S
    name: Power Adapter Connected
    accuracy_decimals: 0
    update_interval: 60s

text_sensor:
  - platform: apple_smc
    key: RPlt
    name: SMC Platform
    update_interval: 3600s
