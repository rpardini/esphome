esphome:
  name: test

esp8266:
  board: esp01_1m

remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 50%

button:
  - platform: template
    name: MCE power
    on_press:
      - remote_transmitter.transmit_rc6_mce:
          command: 0x040C
  - platform: template
    name: MCE other customer code
    on_press:
      - remote_transmitter.transmit_rc6_mce:
          address: 0x1234
          command: 0x0410
