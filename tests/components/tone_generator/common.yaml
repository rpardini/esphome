speaker:
  - platform: i2s_audio
    id: tone_speaker
    i2s_audio_id: i2s_audio_bus
    dac_type: external
    i2s_dout_pin: ${dout_pin}
    bits_per_sample: 16bit
    channel: stereo

tone_generator:
  - id: tone_generator_id
    speaker: tone_speaker
    frequency: 4Hz
    amplitude: 50%
    sample_rate: 48000
    num_channels: 2
