esphome:
  name: linux-sendspin-hwmon-i2c-sdl
  friendly_name: Linux Sendspin HWMon I2C SDL Avahi

host:
  # Any locally administered MAC; it only has to be unique among your ESPHome devices.
  mac_address: "02:ec:40:00:00:06"

logger:
  level: DEBUG

api:

# Needs libavahi-client-dev at build time and a running avahi-daemon.
# Home Assistant then discovers the node, and Music Assistant the Sendspin player.
mdns:
  avahi: true

time:
  - platform: host
    id: host_time

# ---------------------------------------------------------------------------
# hwmon
# Discovery scans /sys/class/hwmon on the machine that runs `esphome compile`.
# List chip names first:  grep . /sys/class/hwmon/*/name
# ---------------------------------------------------------------------------
hwmon:
  discovery:
    update_interval: 30s
    exclude:
      # Already defined below with an id, so the displays can use it.
      - "package_thermal/temp1_*"

sensor:
  - platform: hwmon
    id: cpu_temp
    chip: package_thermal # <-- change to a chip name from the grep above
    input: temp1
    name: CPU Temperature
    update_interval: 5s
    on_value:
      - lvgl.label.update:
          id: cpu_temp_label
          text:
            format: "CPU %.1f °C"
            args: [x]

  # Sendspin track position, for the progress bar
  - platform: sendspin
    id: sendspin_track_progress
    type: track_progress
    internal: true
    on_value:
      - lvgl.bar.update:
          id: track_progress_bar
          value: !lambda |-
            const float duration = id(sendspin_track_duration).state;
            if (std::isnan(duration) || duration <= 0)
              return 0;
            return std::min(1000.0f, x * 1000.0f / duration);
      - lvgl.label.update:
          id: track_time_label
          text: !lambda |-
            auto mmss = [](float ms) {
              const int s = std::isnan(ms) ? 0 : (int) (ms / 1000);
              char buf[16];
              snprintf(buf, sizeof(buf), "%d:%02d", s / 60, s % 60);
              return std::string(buf);
            };
            return mmss(x) + " / " + mmss(id(sendspin_track_duration).state);
  - platform: sendspin
    id: sendspin_track_duration
    type: track_duration
    internal: true

text_sensor:
  - platform: sendspin
    id: sendspin_title
    name: Song Title
    type: title
    on_value:
      - lvgl.label.update:
          id: title_label
          text: !lambda return x;
  - platform: sendspin
    id: sendspin_artist
    name: Song Artist
    type: artist
    on_value:
      - lvgl.label.update:
          id: artist_label
          text: !lambda return x;
  - platform: sendspin
    id: sendspin_album
    name: Album Name
    type: album
    on_value:
      - lvgl.label.update:
          id: album_label
          text: !lambda return x;

# ---------------------------------------------------------------------------
# Sendspin player: PortAudio (portaudio19-dev at build time)
# The config dump lists every PortAudio device with its index; pick one by
# index or by (part of) its name.
# ---------------------------------------------------------------------------
host_audio:

speaker:
  - platform: host_audio
    id: host_speaker
    # device: pipewire

sendspin:
  id: sendspin_hub

media_source:
  - platform: sendspin
    id: sendspin_source

media_player:
  - platform: sendspin
    id: sendspin_group_media_player
    name: Sendspin Group Media Player

  - platform: speaker_source
    id: host_media_player
    name: Sendspin Player
    media_pipeline:
      speaker: host_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 2
      sources:
        - sendspin_source
    on_play:
      - lvgl.page.show: playing_page
    on_idle:
      - lvgl.page.show: idle_page

# Album artwork, delivered by the Sendspin server at the size asked for here
image:
  - platform: sendspin
    id: album_slot
    format: JPEG
    type: RGB565
    resize: 640x640
    source: ALBUM
    # Start the cross-fade before the track boundary so it straddles it
    display_offset: 1s
    current_image:
      id: album_art
    transition_image:
      id: album_art_transition
    on_image_display:
      # The top widget shows the outgoing frame and fades out over the new one underneath
      - lvgl.image.update:
          id: outgoing_art
          src: album_art_transition
      - lvgl.image.update:
          id: incoming_art
          src: album_art
      - lvgl.animation.start: album_art_crossfade
    on_image_clear:
      - logger.log: "Album art cleared"
    on_image_error:
      - logger.log:
          format: "Album art error"
          level: WARN

# ---------------------------------------------------------------------------
# I2C + SSD1306 clock
# ---------------------------------------------------------------------------
i2c:
  - id: i2c_bus
    device: /dev/i2c-5
    frequency: 400kHz
    scan: true

font:
  - file: "gfonts://Roboto Mono@700"
    id: font_clock
    size: 22
  - file: "gfonts://Roboto Mono"
    id: font_small
    size: 11
  # LVGL fonts; the Latin glyph set covers accented track titles
  - file:
      type: gfonts
      family: Roboto
      weight: 300
    id: font_big_clock
    size: 220
    glyphs: "0123456789:"
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: font_title
    size: 48
    glyphsets:
      - GF_Latin_Core
  - file:
      type: gfonts
      family: Roboto
    id: font_body
    size: 32
    glyphsets:
      - GF_Latin_Core

display:
  - platform: ssd1306_i2c
    id: oled
    i2c_id: i2c_bus
    model: SSD1306_128X64
    address: 0x3C
    update_interval: 1s
    lambda: |-
      auto now = id(host_time).now();
      if (!now.is_valid()) {
        it.print(64, 32, id(font_small), TextAlign::CENTER, "no time");
        return;
      }
      it.strftime(64, 24, id(font_clock), TextAlign::CENTER, "%H:%M:%S", now);
      it.strftime(64, 52, id(font_small), TextAlign::CENTER, "%a %Y-%m-%d", now);

  # -------------------------------------------------------------------------
  # SDL, drawn by LVGL. Start the binary with SDL_VIDEODRIVER=kmsdrm to use
  # DRM/KMS. KMSDRM switches to the mode closest to these dimensions, so use
  # the screen's native size (first line of /sys/class/drm/card*-*/modes).
  # -------------------------------------------------------------------------
  - platform: sdl
    id: screen
    dimensions:
      width: 1280
      height: 720
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: sdl
    id: touch
    sdl_id: screen
    display: screen

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: return id(host_time).now().is_valid();
          then:
            - lvgl.label.update:
                id: clock_label
                text: !lambda return id(host_time).now().strftime("%H:%M");
            - lvgl.label.update:
                id: date_label
                text: !lambda return id(host_time).now().strftime("%A, %d %B %Y");

lvgl:
  displays:
    - screen
  touchscreens:
    - touch
  color_depth: 16
  bg_color: 0x101020
  default_font: font_body

  animations:
    - id: album_art_crossfade
      duration: 1500ms
      widgets:
        - id: outgoing_art
          opa:
            from: 100%
            to: 0%
      on_stop:
        # Lets the library deliver the next artwork
        - sendspin.image.transition_finished: album_slot

  # Shown on every page
  top_layer:
    widgets:
      - label:
          id: cpu_temp_label
          align: TOP_RIGHT
          x: -24
          y: 16
          text: "CPU --.- °C"
          text_color: 0xFFA040
          text_font: font_body

  pages:
    - id: idle_page
      bg_color: 0x101020
      widgets:
        - label:
            id: clock_label
            align: CENTER
            y: -50
            text: "--:--"
            text_color: 0xFFFFFF
            text_font: font_big_clock
        - label:
            id: date_label
            align: CENTER
            y: 120
            text: ""
            text_color: 0x8080A0
            text_font: font_body

    - id: playing_page
      bg_color: 0x000000
      widgets:
        # Cross-fade pair: the bottom widget shows the current artwork, the top one
        # the outgoing artwork while it fades out
        - image:
            id: incoming_art
            align: LEFT_MID
            x: 40
            src: album_art
        - image:
            id: outgoing_art
            align: LEFT_MID
            x: 40
            src: album_art
        - obj:
            align: TOP_LEFT
            x: 720
            y: 90
            width: 520
            height: 580
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            widgets:
              - label:
                  id: title_label
                  align: TOP_LEFT
                  width: 520
                  text: ""
                  text_color: 0xFFFFFF
                  text_font: font_title
                  long_mode: SCROLL_CIRCULAR
              - label:
                  id: artist_label
                  align: TOP_LEFT
                  y: 80
                  width: 520
                  text: ""
                  text_color: 0xC0C0C0
                  long_mode: SCROLL_CIRCULAR
              - label:
                  id: album_label
                  align: TOP_LEFT
                  y: 135
                  width: 520
                  text: ""
                  text_color: 0x808080
                  long_mode: SCROLL_CIRCULAR
              - bar:
                  id: track_progress_bar
                  align: TOP_LEFT
                  y: 470
                  width: 520
                  height: 10
                  min_value: 0
                  max_value: 1000
                  value: 0
                  bg_color: 0x303030
                  indicator:
                    bg_color: 0x40C0FF
              - label:
                  id: track_time_label
                  align: TOP_LEFT
                  y: 495
                  text: "0:00 / 0:00"
                  text_color: 0x808080
