esphome:
  name: linux-hwmon-sdl-simple
  friendly_name: Linux HWMon SDL Simple

host:
  # Any locally administered MAC; it only has to be unique among your ESPHome devices.
  mac_address: "02:ec:40:00:00:01"

logger:
  level: DEBUG

api:

time:
  - platform: host
    id: host_time

# ---------------------------------------------------------------------------
# hwmon
# Discovery scans /sys/class/hwmon on the machine that runs `esphome compile`.
# That is the arm64 box itself here, so it picks up the right chips.
# List chip names first:  grep . /sys/class/hwmon/*/name
# ---------------------------------------------------------------------------
hwmon:
  discovery:
    update_interval: 30s
    exclude:
      # Already defined below with an id, so the display can use it.
      - "package_thermal/temp1_*"

sensor:
  - platform: hwmon
    id: cpu_temp
    chip: package_thermal # <-- change to a chip name from the grep above
    input: temp1
    name: CPU Temperature
    update_interval: 5s

# ---------------------------------------------------------------------------
# I2C + SSD1306 clock
# ---------------------------------------------------------------------------
i2c:
  - id: i2c_bus
    device: /dev/i2c-5
    frequency: 400kHz
    scan: true

font:
  - file: "gfonts://Roboto Mono@700"
    id: font_clock
    size: 22
  - file: "gfonts://Roboto Mono"
    id: font_small
    size: 11
  - file: "gfonts://Roboto"
    id: font_big
    size: 48
  - file: "gfonts://Roboto"
    id: font_medium
    size: 24

display:
  - platform: ssd1306_i2c
    id: oled
    i2c_id: i2c_bus
    model: SSD1306_128X64
    address: 0x3C
    update_interval: 1s
    lambda: |-
      auto now = id(host_time).now();
      if (!now.is_valid()) {
        it.print(64, 32, id(font_small), TextAlign::CENTER, "no time");
        return;
      }
      it.strftime(64, 24, id(font_clock), TextAlign::CENTER, "%H:%M:%S", now);
      it.strftime(64, 52, id(font_small), TextAlign::CENTER, "%a %Y-%m-%d", now);

  # -------------------------------------------------------------------------
  # SDL, sent to DRM/KMS/GBM. Start the binary with SDL_VIDEODRIVER=kmsdrm.
  # KMSDRM always covers the whole screen; these dimensions are scaled to the
  # screen size, with black bars if the shape is different.
  # -------------------------------------------------------------------------
  - platform: sdl
    id: screen
    dimensions:
      width: 800
      height: 480
    update_interval: 1s
    auto_clear_enabled: true
    lambda: |-
      it.fill(Color(0x10, 0x10, 0x20));
      auto now = id(host_time).now();
      if (now.is_valid())
        it.strftime(it.get_width() / 2, 90, id(font_big), Color::WHITE, TextAlign::CENTER, "%H:%M:%S", now);

      if (id(cpu_temp).has_state()) {
        it.printf(it.get_width() / 2, 200, id(font_medium), Color(0xFF, 0xA0, 0x40), TextAlign::CENTER,
                  "CPU %.1f °C", id(cpu_temp).state);
      }

      if (id(touch_active)) {
        it.filled_circle(id(touch_x), id(touch_y), 20, Color(0x40, 0xC0, 0xFF));
      }
      it.printf(10, it.get_height() - 10, id(font_small), Color(0x80, 0x80, 0x80), TextAlign::BOTTOM_LEFT,
                "touch: %d,%d %s", id(touch_x), id(touch_y), id(touch_active) ? "down" : "up");

globals:
  - id: touch_x
    type: int
    initial_value: "0"
  - id: touch_y
    type: int
    initial_value: "0"
  - id: touch_active
    type: bool
    initial_value: "false"

touchscreen:
  - platform: sdl
    id: touch
    sdl_id: screen
    display: screen
    on_touch:
      - lambda: |-
          id(touch_x) = touch.x;
          id(touch_y) = touch.y;
          id(touch_active) = true;
          ESP_LOGD("touch", "touch at %d,%d", touch.x, touch.y);
          id(screen).update();
    on_update:
      - lambda: |-
          if (!touches.empty()) {
            id(touch_x) = touches[0].x;
            id(touch_y) = touches[0].y;
          }
    on_release:
      - lambda: |-
          id(touch_active) = false;
          id(screen).update();
