esphome:
  name: linux-sendspin-simple-with-mic
  friendly_name: Linux Sendspin Simple with Mic Avahi

host:
  # Any locally administered MAC; it only has to be unique among your ESPHome devices.
  mac_address: "02:ec:40:00:00:05"

logger:
  level: DEBUG

api:

# Needs libavahi-client-dev at build time and a running avahi-daemon.
# Home Assistant then discovers the node, and Music Assistant the Sendspin player.
mdns:
  avahi: true

# Needs portaudio19-dev at build time. The config dump lists every PortAudio
# device with its index; pick one by index or by (part of) its name.
host_audio:
  # host_api: ALSA

speaker:
  - platform: host_audio
    id: host_speaker
    # device: pipewire
    # latency: 50ms

microphone:
  - platform: host_audio
    id: host_microphone
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: mono

sendspin:

media_source:
  - platform: sendspin
    id: sendspin_source

media_player:
  - platform: speaker_source
    id: host_media_player
    name: Sendspin Player
    media_pipeline:
      speaker: host_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 2
      sources:
        - sendspin_source
